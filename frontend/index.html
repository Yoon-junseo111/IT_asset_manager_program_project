<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Asset Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>IT Asset Manager</h1>
        <p>IT 자산 관리 시스템</p>
    </header>

    <main>

        <!-- ========================================
             대시보드
             ======================================== -->

        <section class="dashboard">

            <!-- 자산 등록 영역 -->
            <section class="asset-form">

                <h2>자산 등록</h2>

                <div class="form-row">

                    <input
                        type="text"
                        id="assetId"
                        placeholder="자산번호 (예: LAPTOP-002)"
                    >

                    <input
                        type="text"
                        id="assetName"
                        placeholder="자산명"
                    >

                    <select id="assetType">

                        <option value="노트북">
                            노트북
                        </option>

                        <option value="모니터">
                            모니터
                        </option>

                        <option value="키보드">
                            키보드
                        </option>

                        <option value="마우스">
                            마우스
                        </option>

                    </select>

                    <select id="assetStatus">

                        <option value="대여 가능">
                            대여 가능
                        </option>

                        <option value="사용 중">
                            사용 중
                        </option>

                        <option value="수리 중">
                            수리 중
                        </option>

                    </select>

                    <input
                        type="text"
                        id="assetUser"
                        placeholder="사용자"
                    >

                    <button id="addAssetButton">
                        등록
                    </button>

                </div>

            </section>


            <!-- 전체 자산 -->
            <div class="asset-card">

                <h3>전체 자산</h3>

                <p id="totalCount">
                    0
                </p>

            </div>


            <!-- 사용 중 -->
            <div class="asset-card">

                <h3>사용 중</h3>

                <p id="usingCount">
                    0
                </p>

            </div>


            <!-- 대여 가능 -->
            <div class="asset-card">

                <h3>대여 가능</h3>

                <p id="availableCount">
                    0
                </p>

            </div>


            <!-- 수리 중 -->
            <div class="asset-card">

                <h3>수리 중</h3>

                <p id="repairCount">
                    0
                </p>

            </div>

        </section>


        <!-- ========================================
             자산 목록
             ======================================== -->

        <section class="asset-list">

            <h2>자산 목록</h2>


            <!-- 검색 및 상태 필터 -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="자산번호, 자산명, 종류, 사용자 검색"
                >


                <select id="statusFilter">

                    <option value="전체">
                        전체 상태
                    </option>

                    <option value="대여 가능">
                        대여 가능
                    </option>

                    <option value="사용 중">
                        사용 중
                    </option>

                    <option value="수리 중">
                        수리 중
                    </option>

                </select>

            </div>


            <!-- 자산 목록 테이블 -->
            <table>

                <thead>

                    <tr>

                        <th>자산번호</th>
                        <th>자산명</th>
                        <th>종류</th>
                        <th>상태</th>
                        <th>사용자</th>
                        <th>대여일</th>
                        <th>반납 예정일</th>
                        <th>관리</th>

                    </tr>

                </thead>


                <tbody id="assetTableBody">

                </tbody>

            </table>

        </section>


        <!-- ========================================
             대여 이력
             ======================================== -->

        <section class="rental-history">

            <h2>대여 이력</h2>


            <table>

                <thead>

                    <tr>

                        <th>자산번호</th>
                        <th>자산명</th>
                        <th>대여자</th>
                        <th>대여일</th>
                        <th>반납 예정일</th>
                        <th>실제 반납일</th>

                    </tr>

                </thead>


                <!-- JavaScript에서 대여 이력을 출력한다. -->
                <tbody id="rentalHistoryTableBody">

                </tbody>

            </table>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
