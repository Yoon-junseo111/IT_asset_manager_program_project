<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Asset Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>IT Asset Manager</h1>
        <p>IT 자산 관리 시스템</p>
    </header>

    <main>

        <section class="dashboard">

            <section class="asset-form">

    <h2>자산 등록</h2>

    <div class="form-row">

        <input
            type="text"
            id="assetId"
            placeholder="자산번호 (예: LAPTOP-002)"
        >

        <input
            type="text"
            id="assetName"
            placeholder="자산명"
        >

        <select id="assetType">
            <option value="노트북">노트북</option>
            <option value="모니터">모니터</option>
            <option value="키보드">키보드</option>
            <option value="마우스">마우스</option>
        </select>

        <select id="assetStatus">
            <option value="대여 가능">대여 가능</option>
            <option value="사용 중">사용 중</option>
            <option value="수리 중">수리 중</option>
        </select>

        <input
            type="text"
            id="assetUser"
            placeholder="사용자"
        >

        <button id="addAssetButton">
            등록
        </button>

    </div>

</section>

            <div class="asset-card">
                <h3>전체 자산</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="asset-card">
                <h3>사용 중</h3>
                <p id="usingCount">0</p>
            </div>

            <div class="asset-card">
                <h3>대여 가능</h3>
                <p id="availableCount">0</p>
            </div>

            <div class="asset-card">
                <h3>수리 중</h3>
                <p id="repairCount">0</p>
            </div>

        </section>

        <section class="asset-list">

            <h2>자산 목록</h2>


            <!-- 자산 검색 및 상태 필터 영역 -->
            <div class="search-box">

                <!--
                    자산번호, 자산명, 종류, 사용자를 검색하기 위한 입력창
                -->
                <input
                    type="text"
                    id="searchInput"
                    placeholder="자산번호, 자산명, 종류, 사용자 검색"
                >

                <!--
                    자산의 상태에 따라 목록을 필터링하기 위한 선택창
                -->
                <select id="statusFilter">

                    <!-- 전체를 선택하면 모든 상태의 자산을 표시한다. -->
                    <option value="전체">전체 상태</option>

                    <!-- 각 자산 상태별 필터 -->
                    <option value="대여 가능">대여 가능</option>
                    <option value="사용 중">사용 중</option>
                    <option value="수리 중">수리 중</option>

                </select>

            </div>

            <table>

                <thead>
                    <tr>
                        <th>자산번호</th>
                        <th>자산명</th>
                        <th>종류</th>
                        <th>상태</th>
                        <th>사용자</th>
                        <th>관리</th>
                    </tr>
                </thead>

                <tbody id="assetTableBody">

                </tbody>

            </table>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
